<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MILLZ GAMES | Admin</title>
<link rel="icon" href="/assets/img/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin-body">
<div id="loginView" class="admin-login">
    <div class="admin-card">
        <img src="/assets/img/logo-mark.png" alt="MILLZ GAMES">
        <h1>Admin</h1>
        <p>Weka games, bei, link na cover. Bei itaonekana chini ya kila game kwenye store.</p>
        <form id="loginForm">
            <label for="adminPass">Password</label>
            <input id="adminPass" type="password" autocomplete="current-password" required>
            <p class="admin-error" id="loginError" hidden></p>
            <button class="btn btn-primary" type="submit">Ingia</button>
        </form>
        <a href="/">← Rudi store</a>
    </div>
</div>

<div id="dashView" hidden>
    <header class="admin-top">
        <a href="/" class="brand"><img src="/assets/img/logo-mark.png" alt=""><span>MILLZ <em>GAMES</em></span></a>
        <div class="admin-top-actions">
            <a class="btn btn-outline" href="/" target="_blank" rel="noopener">View store</a>
            <button class="btn btn-outline" type="button" id="logoutBtn">Logout</button>
        </div>
    </header>

    <main class="admin-wrap">
        <section class="admin-card">
            <h2 id="formTitle">Ongeza game</h2>
            <p class="admin-lead">Jaza jina, bei (TSh), link ya download, na cover. Itaonekana kwenye homepage.</p>
            <form id="itemForm">
                <input type="hidden" id="itemId">
                <div class="admin-row">
                    <div>
                        <label for="itemKind">Aina</label>
                        <select id="itemKind">
                            <option value="game">Game</option>
                            <option value="app">App</option>
                            <option value="tip">eFootball tips</option>
                        </select>
                    </div>
                    <div>
                        <label for="itemTag">Category</label>
                        <input id="itemTag" type="text" placeholder="Action, Sports, Arcade...">
                    </div>
                </div>
                <label for="itemName">Jina la game</label>
                <input id="itemName" type="text" placeholder="Grand Theft Auto VI" required>
                <div class="admin-row">
                    <div>
                        <label for="itemPrice">Bei (TSh)</label>
                        <input id="itemPrice" type="number" min="0" step="100" placeholder="5000">
                    </div>
                    <div>
                        <label for="itemPlatform">Platform</label>
                        <input id="itemPlatform" type="text" placeholder="Android / Windows" value="Android / Windows">
                    </div>
                </div>
                <label for="itemLink">Link ya game / download</label>
                <input id="itemLink" type="url" placeholder="https://...">
                <label for="itemCoverFile">Cover</label>
                <input id="itemCoverFile" type="file" accept="image/jpeg,image/png,image/webp">
                <label for="itemCoverUrl">au cover URL</label>
                <input id="itemCoverUrl" type="text" placeholder="/assets/img/games/gta-vi.jpg">
                <img id="coverPreview" class="cover-preview" alt="" hidden>
                <label class="admin-check"><input id="itemFeatured" type="checkbox"> Featured kwenye homepage</label>
                <label class="admin-check"><input id="itemPublished" type="checkbox" checked> Published (ionekane kwenye store)</label>
                <div class="admin-form-actions">
                    <button class="btn btn-primary" type="submit" id="saveBtn">Save</button>
                    <button class="btn btn-outline" type="button" id="resetBtn">Clear</button>
                </div>
                <p class="admin-ok" id="formOk" hidden></p>
            </form>
        </section>

        <section class="admin-card">
            <h2>Games / apps zilizowekwa</h2>
            <div id="adminList" class="admin-list"></div>
        </section>
    </main>
</div>
<script src="/assets/js/catalog.js"></script>
<script src="/assets/js/admin.js"></script>
</body>
</html>
